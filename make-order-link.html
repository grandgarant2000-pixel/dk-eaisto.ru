<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>АвтоДок — новый заказ</title><style>:root{--bg:#0a0d13;--s:#131826;--s2:#171d2d;--b:rgba(255,255,255,.09);--t:#f2f4f8;--d:#8b93a8;--a:#4c82ff}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);max-width:520px;margin:0 auto;padding:20px 18px 60px}h1{font-size:25px;margin:4px 0 6px}p{color:var(--d);font-size:13px;margin:0 0 16px}.box{background:var(--s);border:1px solid var(--b);border-radius:22px;padding:16px}.g{margin:11px 0}label{display:block;color:var(--d);font-size:12px;margin-bottom:6px}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--b);background:var(--s2);color:#fff;font-size:16px}#price{font-size:25px;font-weight:800;color:#fff;background:transparent;border:0;padding:4px 0}button{width:100%;margin-top:11px;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:700;font-size:16px;cursor:pointer}.secondary{background:var(--s2);border:1px solid var(--b)}textarea{min-height:108px;margin-top:11px;resize:none;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{font-size:11px;color:var(--d)}</style></head><body><h1>Новый заказ</h1><p>Клиент уже согласен — выбери категорию и отправь ему готовую ссылку.</p><div class="box"><div class="row"><div class="g"><label>Категория</label><select id="cat"><option value="B">B / B-такси</option><option value="C">C</option><option value="E">Прицеп / полуприцеп</option></select></div><div class="g"><label>Цена</label><div id="price">6 990 ₽</div></div></div><div class="g"><label>Цель</label><select id="purpose"><option value="drive">Для езды</option><option value="registration">Постановка на учёт</option></select></div><div class="g"><label>Город</label><input id="city" placeholder="Казань"></div><div class="g"><label>Марка и модель</label><input id="model" placeholder="Kia Rio"></div><div class="row"><div class="g"><label>Имя</label><input id="name"></div><div class="g"><label>Телефон</label><input id="phone" inputmode="tel"></div></div><div class="g"><label>Номер заказа</label><input id="order" placeholder="Можно оставить пустым"><div class="hint">Если пусто — создадим временный номер автоматически.</div></div><button id="go">Создать ссылку</button><label style="margin-top:16px">Ссылка клиенту</label><textarea id="out" readonly placeholder="Здесь появится ссылка"></textarea><a id="openLink" href="#" target="_blank" rel="noopener" style="display:none;text-decoration:none"><button type="button">Открыть заказ</button></a><button id="copy" class="secondary">Копировать ссылку</button><label style="margin-top:16px">Готовое сообщение для Avito / MAX / Telegram</label><textarea id="message" readonly placeholder="Готовое сообщение клиенту"></textarea><button id="copyMsg" class="secondary">Копировать сообщение</button></div><script>
const $=id=>document.getElementById(id);
const prices={B:6990,C:9990,E:9990};
const ORDER_BASE_URL='https://dk-eaisto.ru/order.html';

function fmt(n){return n.toLocaleString('ru-RU')+' ₽'}
function updatePrice(){$('price').textContent=fmt(prices[$('cat').value])}
$('cat').onchange=updatePrice;
updatePrice();

function makeId(){return 'AD-'+String(Date.now()).slice(-6)}

$('go').onclick=function(){
  const cat=$('cat').value;
  const price=prices[cat];
  const order=$('order').value.trim()||makeId();
  $('order').value=order;

  const p=new URLSearchParams({
    order,
    price:String(price),
    category:cat,
    purpose:$('purpose').value,
    city:$('city').value.trim(),
    model:$('model').value.trim(),
    name:$('name').value.trim(),
    phone:$('phone').value.trim()
  });

  const url=ORDER_BASE_URL+'?'+p.toString();
  $('out').value=url;
  $('message').value='Всё согласовали. Загрузите документы по ссылке:\n'+url;
  $('openLink').href=url;
  $('openLink').style.display='block';
};

function markCopied(btnId){
  const btn=$(btnId);
  const old=btn.textContent;
  btn.textContent='Скопировано ✓';
  setTimeout(()=>btn.textContent=old,1200);
}

async function copyText(inputId,btnId){
  const el=$(inputId);
  const value=el.value;
  if(!value)return;

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(value);
      markCopied(btnId);
      return;
    }
  }catch(e){}

  try{
    el.focus();
    el.select();
    el.setSelectionRange(0,value.length);
    const ok=document.execCommand('copy');
    if(ok){
      markCopied(btnId);
      el.setSelectionRange(0,0);
      el.blur();
      return;
    }
  }catch(e){}

  el.focus();
  el.select();
  alert('Автокопирование заблокировано браузером. Ссылка выделена — нажмите Ctrl+C.');
}

$('copy').onclick=()=>copyText('out','copy');
$('copyMsg').onclick=()=>copyText('message','copyMsg');
</script></body></html>
